[project]
name = "lasmh"
version = "0.1.0"
description = "Last Authentication Server Made by Hand"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.143.0",
    "typing-extensions>=4.16.0",
]

[dependency-groups]
dev = [
    "pyrefly>=1.3.2",
    "ruff>=0.16.10",
]


[tool.ruff.lint]
preview = true

[tool.ruff.format]
preview = true

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
search-path = ["src"]
